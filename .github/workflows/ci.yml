name: CI

on:
  push:
    branches: [main, "claude/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar secretos
        run: bash scripts/check-secrets.sh

  database:
    name: Base de datos (migraciones + RLS)
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - uses: actions/checkout@v4
      - name: Asegurar PostgreSQL
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
      - name: Migraciones y pruebas de RLS
        run: bash scripts/test-db.sh

  mobile:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    needs: hygiene
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si existe la app
        id: app
        working-directory: .
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "apps/mobile todavía no existe (se crea en el Hito 3). Se omite."
          fi
      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.exists == 'true'
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - if: steps.app.outputs.exists == 'true'
        run: flutter pub get
      - if: steps.app.outputs.exists == 'true'
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver screenshots
      - if: steps.app.outputs.exists == 'true'
        run: flutter analyze
      - if: steps.app.outputs.exists == 'true'
        run: flutter test

  android:
    name: Android (emulador + integración)
    runs-on: ubuntu-latest
    needs: mobile
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si existe la app
        id: app
        working-directory: .
        run: |
          if [ -f apps/mobile/integration_test/app_test.dart ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Habilitar KVM (aceleración del emulador)
        if: steps.app.outputs.exists == 'true'
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        if: steps.app.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: steps.app.outputs.exists == 'true'
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - if: steps.app.outputs.exists == 'true'
        run: flutter pub get
      - name: Compilar APK debug
        if: steps.app.outputs.exists == 'true'
        run: flutter build apk --debug
      - name: Pruebas de integración en emulador (API 34)
        if: steps.app.outputs.exists == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart
      - name: Publicar capturas del emulador
        if: always() && steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: apps/mobile/build/integration_screenshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar APK debug
        if: success() && steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vivensia-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
